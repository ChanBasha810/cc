<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Login Experience</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            max-width: 420px;
            width: 90%;
            animation: floatCard 6s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 0.95rem;
            opacity: 0.85;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        input[type="password"] {
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            outline: none;
            width: 70%;
            transition: all 0.3s ease;
        }

        input[type="password"]::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        input[type="password"]:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        button:active {
            transform: scale(0.98);
        }

        #error-msg {
            color: #ffada6;
            display: none;
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* Shake animation for incorrect password */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="glass-card" id="cardContainer">
        <h2>Need to verify</h2>
        <p class="subtitle">Enter your password to unlock the page.</p>
        
        <div class="input-group">
            <input type="password" id="password-input" placeholder="Password..." onkeypress="handleKeyPress(event)">
            <button onclick="verifyPassword()">Enter</button>
        </div>
        
        <p id="error-msg">Incorrect password! Please try again.</p>
    </div>

    <script>
        function verifyPassword() {
            const correctPassword = "Chan$5c6";
            const passwordInput = document.getElementById("password-input");
            const enteredPassword = passwordInput.value;
            const errorMsg = document.getElementById("error-msg");
            const card = document.getElementById("cardContainer");

            if (enteredPassword === correctPassword) {
                // Smooth transition effect before redirecting
                card.style.transition = "opacity 0.5s ease, transform 0.5s ease";
                card.style.opacity = "0";
                card.style.transform = "scale(0.9)";
                setTimeout(() => {
                    window.location.href = "mainGift.html";
                }, 500);
            } else {
                errorMsg.style.display = "block";
                passwordInput.value = "";
                
                // Trigger shake effect
                card.classList.remove("shake");
                void card.offsetWidth; // Force reflow
                card.classList.add("shake");
            }
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                verifyPassword();
            }
        }
    </script>

</body>
</html>
